name: Repo Cassette alternate routes
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-package-lock --ignore-scripts
      - uses: ./alt-route-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
