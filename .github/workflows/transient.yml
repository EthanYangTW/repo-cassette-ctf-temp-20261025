name: Repo Cassette transient artifact probe
on:
  push:
    paths:
      - .github/workflows/transient.yml
      - transient-probe.mjs
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node release-route-probe.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
