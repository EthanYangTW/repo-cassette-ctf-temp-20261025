name: Repo Cassette transient artifact probe
on:
  push:
    paths:
      - .github/workflows/transient.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-package-lock --ignore-scripts
      - uses: ./transient-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
